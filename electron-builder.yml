appId: com.fragrance.studio
productName: Fragrance
directories:
  output: release
win:
  target: nsis
  icon: null
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
asar: true
extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"
      - "!scripts/**"
files:
  - out/**/*
  - "!node_modules/**"
